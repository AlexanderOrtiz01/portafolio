name = "portfolio-visits"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Create with: npx wrangler kv namespace create VISITS
[[kv_namespaces]]
binding = "VISITS"
id = "REPLACE_WITH_KV_ID"

[vars]
ALLOWED_ORIGIN = "https://alexanderortiz01.github.io"

# ADMIN_TOKEN is a secret, not a var. Set it with:
#   npx wrangler secret put ADMIN_TOKEN
